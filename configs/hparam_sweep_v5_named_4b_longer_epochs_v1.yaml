# Continuation ablation: test whether v5 needs more than two epochs.
# Everything except epoch count and learning rate is inherited and fixed.
base_config: configs/experiment_v5_named_4b_ep2_lr5e-6.yaml

# The preceding sweep identified 2 epoch / 5e-6 as the only configuration
# with a positive Daily signal.  Continue from the two conservative rates:
# 2e-6 tests slower accumulation, while 5e-6 tests whether the selected point
# improves or overfits with additional passes.  1e-5 is excluded because it
# already produced substantially shorter answers and worse judge quality.
grid:
  epochs: [3, 4]
  learning_rates: [0.000002, 0.000005]
  seeds: [42]

runner:
  # A fresh namespace preserves the completed 1–2 epoch sweep unchanged.
  outputs_root: outputs/ablation/zhongli_lora_v5_named_4b_longer_epochs_sweep_v1
  results_root: results/ablation/zhongli_lora_v5_named_4b_longer_epochs_sweep_v1
  reference_test_file: data/v5/test_reference_eval.jsonl
  core_test_file: eval/data/eval_single.jsonl
  judge_model: deepseek-flash
  reference_max_new_tokens: 96
  core_max_new_tokens: 96
  # Keep the 28-item main suite out of parameter selection.
  generate_core_by_default: false
