# Hyperparameter ablation for the v5 Zhongli corpus.
#
# The data split, model, seed policy and decoding remain fixed.  The main
# variables are epoch count and learning rate; two isolated LoRA
# regularisation checks are included at the end.
base_config: configs/experiment_v5_4b.yaml

# The previous v5 run showed a substantial length collapse at epoch=2,
# learning_rate=3e-5.  Therefore this is not a rectangular grid: it excludes
# the clearly over-aggressive region (epoch=3 and lr=5e-5), concentrates on
# lower learning rates/early stopping, and adds only two regularisation checks.
#
# All but the named override fields inherit the exact v5-4B configuration.
runs:
  # Main axis: can lower learning rate keep the useful changes while avoiding
  # the short-answer collapse?  One epoch is the primary candidate because
  # the original model already degraded by its second epoch.
  - id: ep1_lr5e-6
    epochs: 1
    learning_rate: 0.000005
    seed: 42
  - id: ep1_lr1e-5
    epochs: 1
    learning_rate: 0.00001
    seed: 42
  - id: ep1_lr2e-5
    epochs: 1
    learning_rate: 0.00002
    seed: 42
  - id: ep1_lr3e-5
    epochs: 1
    learning_rate: 0.00003
    seed: 42

  # A small two-epoch low-LR check.  It tests training duration without
  # repeating the already-known harmful 2 epoch / 3e-5 point.
  - id: ep2_lr5e-6
    epochs: 2
    learning_rate: 0.000005
    seed: 42
  - id: ep2_lr1e-5
    epochs: 2
    learning_rate: 0.00001
    seed: 42

  # Regularisation ablations.  Each differs from one matching early-stop
  # baseline in exactly one LoRA parameter.
  - id: ep1_lr3e-5_dropout010
    epochs: 1
    learning_rate: 0.00003
    seed: 42
    overrides:
      lora_dropout: 0.10
  - id: ep1_lr2e-5_rank8
    epochs: 1
    learning_rate: 0.00002
    seed: 42
    overrides:
      lora_r: 8
      lora_alpha: 16

runner:
  outputs_root: outputs/ablation/zhongli_lora_v5_4b_hparam_grid
  results_root: results/ablation/zhongli_lora_v5_4b_hparam_grid
  reference_test_file: data/v5/test_reference_eval.jsonl
  core_test_file: eval/data/eval_single.jsonl
  judge_model: deepseek-flash
  reference_max_new_tokens: 160
  core_max_new_tokens: 192
  # The 28 open questions are the final human evaluation set.  Do not include
  # them in every grid run: generate them only for selected candidates with
  # `--generate-core`, otherwise they become a tuning set.
  generate_core_by_default: false
